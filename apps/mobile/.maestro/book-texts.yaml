# A Book with a long summary shows 4 lines and "Read more", which opens it in place and
# folds it again; a Book with contents shows a "Contents" row that opens one chapter per
# line; a short summary shows in full with no control; a Book with neither shows no heading.
# Needs the end-to-end API on port 3000 (npm run e2e starts it).
appId: ph.edu.umak.libras
---
- launchApp:
    clearState: true
- runScript: scripts/create-members.js
- runScript: scripts/create-book-texts.js
- extendedWaitUntil:
    visible: "SIGN UP"
    timeout: 30000
- tapOn:
    id: welcome-sign-in
- tapOn:
    id: sign-in-email
- retry:
    maxRetries: 3
    commands:
      - eraseText: 80
      - inputText: ${output.email}
      - assertVisible: ${output.email}
- tapOn:
    id: sign-in-password
- inputText: ${output.password}
- hideKeyboard
- tapOn:
    id: sign-in-continue
- extendedWaitUntil:
    visible:
      id: search-(open|input)
    timeout: 20000

# The Book with the long summary and the contents.
- runFlow:
    file: subflows/search-for.yaml
    env:
      QUERY: ${output.longWord}
- extendedWaitUntil:
    visible: ${output.longTitle}.*
    timeout: 15000
- tapOn: ${output.longTitle}.*
- extendedWaitUntil:
    visible:
      id: book-sheet
    timeout: 15000
- assertVisible: "About this book"
- assertVisible: "Read more"
# The cut itself is checked on the screenshots: Android reports a cut text in full.
- takeScreenshot: book-texts-folded
- tapOn:
    id: book-summary-toggle
- assertVisible: "Show less"
- takeScreenshot: book-texts-expanded
- tapOn:
    id: book-summary-toggle
- assertVisible: "Read more"

# Contents is folded until opened, then lists one chapter per line.
- assertVisible: "Contents"
- assertNotVisible: ${output.chapterTwo}
- tapOn:
    id: book-contents-toggle
- assertVisible: ${output.chapterOne}
- assertVisible: ${output.chapterTwo}
- assertVisible: ${output.chapterThree}
- takeScreenshot: book-texts-contents
- tapOn:
    id: book-contents-toggle
- assertNotVisible: ${output.chapterTwo}
- tapOn:
    id: book-close
- extendedWaitUntil:
    visible:
      id: search-results
    timeout: 10000

# A short summary shows in full with no control, and there is no Contents row.
- runFlow:
    file: subflows/search-for.yaml
    env:
      QUERY: ${output.shortWord}
- extendedWaitUntil:
    visible: ${output.shortTitle}.*
    timeout: 15000
- tapOn: ${output.shortTitle}.*
- extendedWaitUntil:
    visible:
      id: book-sheet
    timeout: 15000
- assertVisible: "About this book"
- assertVisible: ${output.shortSummary}
- assertNotVisible:
    id: book-summary-toggle
- assertNotVisible: "Contents"
- takeScreenshot: book-texts-short
