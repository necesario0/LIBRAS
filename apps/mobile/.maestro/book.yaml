# A Member opens a Book from the search results and sees its details and how many
# of its Copies are available. A long title with three authors wraps above the
# edition, year and availability tags (laid out as the approved Tier 3 preview). A Visitor sees the same page with a note that
# their Account Type cannot borrow.
# Needs the end-to-end API on port 3000 (npm run e2e starts it).
appId: ph.edu.umak.libras
---
- launchApp:
    clearState: true
- runScript: scripts/create-members.js
- runScript: scripts/create-book-page.js

# A UMAK Student signs in and searches for the Book.
- extendedWaitUntil:
    visible: "SIGN  UP"
    timeout: 30000
- tapOn:
    id: welcome-sign-in
- tapOn:
    id: sign-in-email
- retry:
    maxRetries: 3
    commands:
      - eraseText: 80
      - inputText: ${output.email}
      - assertVisible: ${output.email}
- tapOn:
    id: sign-in-password
- inputText: ${output.password}
- hideKeyboard
- tapOn:
    id: sign-in-continue
- extendedWaitUntil:
    visible:
      id: search-(open|input)
    timeout: 20000
- runFlow:
    file: subflows/search-for.yaml
    env:
      QUERY: ${output.word}
- extendedWaitUntil:
    visible: ${output.title}.*
    timeout: 15000

# Opening the result shows the Book's details and its Copies.
- tapOn: ${output.title}.*
- extendedWaitUntil:
    visible:
      id: book-sheet
    timeout: 15000
- assertVisible: "CALL NO."
- assertVisible: ${output.callNumber}
- assertVisible: ${output.title}
- assertVisible: ${output.authors}
- assertVisible: ${output.edition}
- assertVisible: "1960"
- assertVisible: "2 of 3 available"
- assertVisible: ${output.isbn}
# A Book with no summary and no contents shows neither heading.
- assertNotVisible: "About this book"
- assertNotVisible: "Contents"
# A UMAK Student can borrow, so there is no cannot-borrow note.
- assertNotVisible:
    id: cannot-borrow-note
- takeScreenshot: book-student

# Closing the page returns to the results.
- tapOn:
    id: book-close
- extendedWaitUntil:
    visible:
      id: search-results
    timeout: 10000
- assertNotVisible:
    id: book-sheet

# A Book with no Copy available says so.
- runFlow:
    file: subflows/search-for.yaml
    env:
      QUERY: ${output.noneWord}
- extendedWaitUntil:
    visible: ${output.noneTitle}
    timeout: 15000
- tapOn: ${output.noneTitle}
- extendedWaitUntil:
    visible:
      id: book-sheet
    timeout: 15000
- assertVisible: "None available"
- takeScreenshot: book-none-available
- tapOn:
    id: book-close
- extendedWaitUntil:
    visible:
      id: search-results
    timeout: 10000

# A real catalog title that wraps over several lines, with three authors: every
# line shows, and the tags sit below the authors (the screenshot shows nothing
# overlaps; Maestro cannot see an overlap).
- runFlow:
    file: subflows/search-for.yaml
    env:
      QUERY: ${output.longWord}
- extendedWaitUntil:
    visible: ${output.longTitle}.*
    timeout: 15000
- tapOn: ${output.longTitle}.*
- extendedWaitUntil:
    visible:
      id: book-sheet
    timeout: 15000
- assertVisible:
    id: book-detail-title
    text: ${output.longTitle}
- assertVisible:
    id: book-detail-authors
    text: ${output.longAuthors}
- assertVisible: ${output.longEdition}
- assertVisible: "2021"
- assertVisible: "2 of 3 available"
- takeScreenshot: book-long-title
- tapOn:
    id: book-close
- runFlow: subflows/leave-search.yaml
- runFlow: subflows/sign-out.yaml
- extendedWaitUntil:
    visible: "SIGN  UP"
    timeout: 20000

# A Visitor sees the Book and is told they cannot borrow.
- tapOn:
    id: welcome-sign-in
- tapOn:
    id: sign-in-email
- retry:
    maxRetries: 3
    commands:
      - eraseText: 80
      - inputText: ${output.visitorEmail}
      - assertVisible: ${output.visitorEmail}
- tapOn:
    id: sign-in-password
- inputText: ${output.visitorPassword}
- hideKeyboard
- tapOn:
    id: sign-in-continue
- extendedWaitUntil:
    visible:
      id: search-(open|input)
    timeout: 20000
- runFlow:
    file: subflows/search-for.yaml
    env:
      QUERY: ${output.word}
- extendedWaitUntil:
    visible: ${output.title}.*
    timeout: 15000
- tapOn: ${output.title}.*
- extendedWaitUntil:
    visible:
      id: book-sheet
    timeout: 15000
- assertVisible: "2 of 3 available"
- scrollUntilVisible:
    element:
      id: book-borrow
    direction: DOWN
    timeout: 15000
- assertVisible: ".*In-library use only.*"
- assertNotVisible:
    id: cannot-borrow-note
- takeScreenshot: book-visitor

# Dragging the grabber up expands the Book sheet to fullscreen; dragging partway down returns to default, then swiping down closes.
- swipe:
    from:
      id: book-grabber
    direction: UP
- extendedWaitUntil:
    notVisible:
      id: book-backdrop
    timeout: 5000
- takeScreenshot: book-fullscreen
- swipe:
    start: 50%, 8%
    end: 50%, 45%
    duration: 500
- extendedWaitUntil:
    visible:
      id: book-backdrop
    timeout: 5000
- swipe:
    from:
      id: book-grabber
    direction: DOWN
- extendedWaitUntil:
    notVisible:
      id: book-sheet
    timeout: 5000
