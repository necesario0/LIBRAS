# A Member changes their password from the Profile tab's Change password row.
# Cancel leaves without a change. A wrong current password shows the red
# "Current password is incorrect." state. The right one changes the password,
# shows the success dialog and returns to Profile; this phone stays signed in
# (also after a restart) while another device's session ends, the "your password
# was changed" email is sent, and only the new password signs in afterwards.
# Needs the end-to-end API on port 3000 (npm run e2e starts it).
appId: ph.edu.umak.libras
---
- launchApp:
    clearState: true
- runScript: scripts/create-members.js

- extendedWaitUntil:
    visible: "SIGN  UP"
    timeout: 30000
- tapOn:
    id: welcome-sign-in
- tapOn:
    id: sign-in-email
- inputText: ${output.email}
- tapOn:
    id: sign-in-password
- inputText: ${output.password}
- hideKeyboard
- tapOn:
    id: sign-in-continue
- extendedWaitUntil:
    visible: "Hi, Cobby"
    timeout: 20000

# Another device is signed in to the same account.
- runScript:
    file: scripts/other-session.js
    env:
      EMAIL: ${output.email}
      PASSWORD: ${output.password}

# The Profile tab, then its Change password row.
- tapOn:
    id: tab-profile
- extendedWaitUntil:
    visible:
      id: profile-change-password
    timeout: 10000
- assertVisible: "Change password"
- takeScreenshot: change-password-row
- tapOn:
    id: profile-change-password
- extendedWaitUntil:
    visible: "Change Password"
    timeout: 10000
- assertVisible: "Current Password"
- assertVisible: "Different from your current password"
- takeScreenshot: change-password-empty

# Cancel leaves without a change.
- tapOn:
    id: password-cancel
- extendedWaitUntil:
    visible:
      id: profile-change-password
    timeout: 10000
- tapOn:
    id: profile-change-password
- extendedWaitUntil:
    visible: "Current Password"
    timeout: 10000

# A wrong current password: the red state of the frame, and nothing changes.
# Each password goes into an empty field, because a tap on a field that holds
# long text puts the cursor in its middle.
- tapOn:
    id: current-password-toggle
- tapOn:
    id: current-password
- inputText: not-my-password
- tapOn:
    id: new-password-toggle
- tapOn:
    id: new-password
- inputText: ${output.password}-new
- tapOn:
    id: confirm-password-toggle
- tapOn:
    id: confirm-password
- inputText: ${output.password}-new
- hideKeyboard
- takeScreenshot: change-password-filled
- tapOn:
    id: password-save
- extendedWaitUntil:
    visible: "Current password is incorrect."
    timeout: 20000
- takeScreenshot: change-password-wrong-current
- assertNotVisible: "Password updated"

# The right current password. Typing in the field clears the red state.
- tapOn:
    id: current-password
- eraseText: 20
- assertNotVisible: "Current password is incorrect."
- inputText: ${output.password}
- hideKeyboard
- tapOn:
    id: password-save
- extendedWaitUntil:
    visible: "Password updated"
    timeout: 20000
- takeScreenshot: change-password-updated
- assertVisible: "Back to Profile"
- tapOn:
    id: password-updated-action
- extendedWaitUntil:
    visible:
      id: profile-change-password
    timeout: 10000

# This phone is still signed in, with the same session after a restart.
- stopApp
- launchApp
- extendedWaitUntil:
    visible: "Hi, Cobby"
    timeout: 30000

# The other device is signed out and the notice email went out.
- runScript:
    file: scripts/check-password-changed.js
    env:
      EMAIL: ${output.email}
      OTHER_TOKEN: ${output.accessToken}
      OLD_PASSWORD: ${output.password}
      NEW_PASSWORD: ${output.password}-new

# Only the new password signs in. Sign out, then try the old one.
- runFlow: subflows/sign-out.yaml
- extendedWaitUntil:
    visible: "SIGN  UP"
    timeout: 20000
- tapOn:
    id: welcome-sign-in
- tapOn:
    id: sign-in-email
- inputText: ${output.email}
- tapOn:
    id: sign-in-password
- inputText: ${output.password}
- hideKeyboard
- tapOn:
    id: sign-in-continue
- assertVisible: "The email or password is incorrect."
- assertNotVisible: "Hi, Cobby"
- back

# The new password signs in, on a fresh sign-in screen.
- tapOn:
    id: welcome-sign-in
- tapOn:
    id: sign-in-email
- inputText: ${output.email}
- tapOn:
    id: sign-in-password
- inputText: ${output.password}-new
- hideKeyboard
- tapOn:
    id: sign-in-continue
- extendedWaitUntil:
    visible: "Hi, Cobby"
    timeout: 20000
