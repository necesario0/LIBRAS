# A UMAK Student places a Hold on a Book whose only Copy is out with another
# Member. The Librarian records the return (the end-to-end API does it, as the
# desk page would): the Hold becomes ready, and the app shows it with the end of
# the Pickup Window in the Holds segment of My Books, which now opens on Holds,
# and on the Book page; the My Books tab and its Holds segment get a dot. The
# Member shows the Digital ID, the Librarian lends the set-aside Copy, and the
# Hold is listed as borrowed, with the dot gone.
# Needs the end-to-end API on port 3000 (npm run e2e starts it).
appId: ph.edu.umak.libras
---
- launchApp:
    clearState: true
- runScript: scripts/create-hold-ready.js

# The UMAK Student signs in. The emulator sometimes doubles the first character
# typed after a tap: check and retype.
- extendedWaitUntil:
    visible: "SIGN  UP"
    timeout: 30000
- tapOn:
    id: welcome-sign-in
- tapOn:
    id: sign-in-email
- retry:
    maxRetries: 3
    commands:
      - eraseText: 80
      - inputText: ${output.email}
      - assertVisible: ${output.email}
- tapOn:
    id: sign-in-password
- inputText: ${output.password}
- hideKeyboard
- tapOn:
    id: sign-in-continue

# The Book's only Copy is out: the Member places a Hold.
- extendedWaitUntil:
    visible:
      id: search-(open|input)
    timeout: 20000
- runFlow:
    file: subflows/search-for.yaml
    env:
      QUERY: ${output.heldWord}
- extendedWaitUntil:
    visible: ${output.heldTitle}
    timeout: 15000
- tapOn: ${output.heldTitle}
- extendedWaitUntil:
    visible:
      id: book-sheet
    timeout: 15000
- extendedWaitUntil:
    visible:
      id: hold-place
    timeout: 15000
- tapOn:
    id: hold-place
- extendedWaitUntil:
    visible:
      id: hold-placed
    timeout: 15000
- assertVisible: "You have a Hold on this Book: waiting"
- assertNotVisible:
    id: hold-digital-id
- tapOn:
    id: book-close
- extendedWaitUntil:
    visible:
      id: search-results
    timeout: 10000
# A waiting Hold earns no dot.
- runFlow: subflows/leave-search.yaml
- assertNotVisible:
    id: tab-my-books-dot

# The Copy comes back at the desk: the Hold is dispatched and the Member is emailed.
- runScript: scripts/return-held-copy.js

# My Books opens on Holds: the Hold is ready, with the end of the Pickup Window.
# The tab and the Holds segment have a dot; Loans does not.
- runFlow: subflows/leave-search.yaml
- tapOn:
    id: tab-my-books
- extendedWaitUntil:
    visible:
      id: hold-pickup
    timeout: 15000
- assertVisible:
    id: holds-segment
- runFlow: subflows/leave-search.yaml
- assertVisible:
    id: tab-my-books-dot
- assertVisible:
    id: my-books-holds-dot
- assertNotVisible:
    id: my-books-loans-dot
- assertVisible: ${output.heldTitle}
- assertVisible: "Ready for pickup"
- assertVisible: "A Copy is set aside for you"
- assertVisible: "Show your Digital ID at the library desk by [A-Z][a-z]{2} [0-9]{1,2}, 20[0-9]{2}, [0-9]{1,2}:[0-9]{2} (AM|PM) to borrow it. After that your Hold expires."
- assertNotVisible: "Waiting"
- takeScreenshot: hold-ready-list

# A ready Hold can be cancelled too: the app asks once more, in other words.
- tapOn:
    id: hold-cancel
- assertVisible: "Give up the Copy that is set aside for you?"
- takeScreenshot: hold-ready-cancel-confirm
- tapOn:
    id: hold-cancel-keep
- assertVisible:
    id: hold-pickup

# The row's Show my Digital ID opens the Digital ID tab.
- tapOn:
    id: hold-digital-id
- extendedWaitUntil:
    visible:
      id: digital-id-code
    timeout: 15000
- assertVisible: "Show this to the librarian"

# The Book page says until when the Copy is set aside, and leads to the Holds segment and to the Digital ID.
- runFlow: subflows/leave-search.yaml
- tapOn:
    id: tab-home
- extendedWaitUntil:
    visible: ${output.heldTitle}
    timeout: 15000
- assertVisible: "None available"
- tapOn: ${output.heldTitle}
- extendedWaitUntil:
    visible:
      id: book-sheet
    timeout: 15000
- scrollUntilVisible:
    element:
      id: hold-see-all
    direction: DOWN
    timeout: 15000
- assertVisible: "You have a Hold on this Book: ready for pickup"
- assertVisible: "A Copy is set aside for you until [A-Z][a-z]{2} [0-9]{1,2}, 20[0-9]{2}, [0-9]{1,2}:[0-9]{2} (AM|PM). Show your Digital ID at the library desk to borrow it."
- takeScreenshot: hold-ready-book
- tapOn:
    id: hold-see-all
- extendedWaitUntil:
    visible:
      id: hold-pickup
    timeout: 15000
- assertVisible:
    id: holds-segment
- assertNotVisible:
    id: book-sheet
- runFlow: subflows/leave-search.yaml
- tapOn:
    id: tab-home
- extendedWaitUntil:
    visible: ${output.heldTitle}
    timeout: 15000
- tapOn: ${output.heldTitle}
- extendedWaitUntil:
    visible:
      id: book-sheet
    timeout: 15000
- scrollUntilVisible:
    element:
      id: hold-digital-id
    direction: DOWN
    timeout: 15000

# The Member shows the Digital ID, and the Librarian lends the set-aside Copy.
- tapOn:
    id: hold-digital-id
- extendedWaitUntil:
    visible:
      id: digital-id-code
    timeout: 15000
- runScript: scripts/lend-held-copy.js
- extendedWaitUntil:
    visible:
      id: borrowed-card
    timeout: 20000
- assertVisible: "Successfully.*Borrowed"
- assertVisible: ${output.heldTitle}
- takeScreenshot: hold-ready-borrowed

# The Hold is over: My Books opens on Loans with the new Loan, the dot is gone,
# and the Holds segment lists the Hold as borrowed.
- tapOn:
    id: borrowed-home
- extendedWaitUntil:
    visible:
      id: search-(open|input)
    timeout: 15000
- runFlow: subflows/leave-search.yaml
- tapOn:
    id: tab-my-books
- extendedWaitUntil:
    visible:
      id: loans-current
    timeout: 15000
- assertVisible: "Current - 1 of 3"
- runFlow: subflows/leave-search.yaml
- assertNotVisible:
    id: tab-my-books-dot
- tapOn:
    id: my-books-holds
- extendedWaitUntil:
    visible:
      id: holds-past
    timeout: 15000
- assertVisible: "Borrowed"
- assertNotVisible:
    id: hold-pickup
- assertNotVisible:
    id: hold-cancel
- assertNotVisible:
    id: holds-active
- takeScreenshot: hold-ready-fulfilled
