# A UMAK Student places a Hold on a Book that has no available Copy, sees it in
# the Holds segment of My Books, and cancels it. A waiting Hold puts no dot on
# the My Books tab. A Book with a Copy available has no Hold action, and a
# Visitor is not offered one: their tab is "Saved", with no segments.
# Needs the end-to-end API on port 3000 (npm run e2e starts it).
appId: ph.edu.umak.libras
---
- launchApp:
    clearState: true
- runScript: scripts/create-holds.js

# The UMAK Student signs in. The emulator sometimes doubles the first character
# typed after a tap: check and retype.
- extendedWaitUntil:
    visible: "SIGN  UP"
    timeout: 30000
- tapOn:
    id: welcome-sign-in
- tapOn:
    id: sign-in-email
- retry:
    maxRetries: 3
    commands:
      - eraseText: 80
      - inputText: ${output.email}
      - assertVisible: ${output.email}
- tapOn:
    id: sign-in-password
- inputText: ${output.password}
- hideKeyboard
- tapOn:
    id: sign-in-continue

# With no Holds, My Books opens on Loans and its Holds segment says so. Nothing earns a dot.
- runFlow: subflows/leave-search.yaml
- extendedWaitUntil:
    visible:
      id: tab-my-books
    timeout: 20000
- runFlow: subflows/leave-search.yaml
- tapOn:
    id: tab-my-books
- extendedWaitUntil:
    visible:
      id: loans-segment
    timeout: 15000
- assertVisible: "My Books"
- runFlow: subflows/leave-search.yaml
- assertNotVisible:
    id: tab-my-books-dot
- tapOn:
    id: my-books-holds
- extendedWaitUntil:
    visible:
      id: holds-empty
    timeout: 15000
- takeScreenshot: holds-my-books-empty
- runFlow: subflows/leave-search.yaml
- tapOn:
    id: tab-home

# A Book with a Copy available has no Hold action.
- runFlow:
    file: subflows/search-for.yaml
    env:
      QUERY: ${output.openWord}
- extendedWaitUntil:
    visible: ${output.openTitle}
    timeout: 15000
- tapOn: ${output.openTitle}
- extendedWaitUntil:
    visible:
      id: book-sheet
    timeout: 15000
- assertVisible: "[0-9]+ of [0-9]+ available"
- assertNotVisible:
    id: hold-action
- assertNotVisible:
    id: hold-place
- takeScreenshot: holds-book-available
- tapOn:
    id: book-close

# A Book with no Copy available offers a Hold.
- extendedWaitUntil:
    visible:
      id: search-results
    timeout: 10000
- runFlow:
    file: subflows/search-for.yaml
    env:
      QUERY: ${output.heldWord}
- extendedWaitUntil:
    visible: ${output.heldTitle}
    timeout: 15000
- tapOn: ${output.heldTitle}
- extendedWaitUntil:
    visible:
      id: book-sheet
    timeout: 15000
- assertVisible: "None available"
- extendedWaitUntil:
    visible:
      id: hold-place
    timeout: 15000
- assertVisible: "No Copy is available right now"
- takeScreenshot: holds-book-none-available
- tapOn:
    id: hold-place

# Placing it replaces the button with where the Member stands.
- extendedWaitUntil:
    visible:
      id: hold-placed
    timeout: 15000
- assertVisible: "You have a Hold on this Book: waiting"
- assertNotVisible:
    id: hold-place
- takeScreenshot: holds-book-placed
- tapOn:
    id: book-close
- extendedWaitUntil:
    visible:
      id: search-results
    timeout: 10000

# The Holds segment lists it with its status, and the day it was placed in the
# library's time zone: placed at 04:00 on Nov 11 in Manila, still Nov 10 in UTC.
# A waiting Hold is not urgent: My Books still opens on Loans, with no dot.
- runScript: scripts/hold-placed-at-night.js
- runFlow: subflows/leave-search.yaml
- tapOn:
    id: tab-my-books
- extendedWaitUntil:
    visible:
      id: loans-segment
    timeout: 15000
- runFlow: subflows/leave-search.yaml
- assertNotVisible:
    id: tab-my-books-dot
- tapOn:
    id: my-books-holds
- extendedWaitUntil:
    visible:
      id: holds-active
    timeout: 15000
- assertVisible: ${output.heldTitle}
- assertVisible: "Waiting"
- assertVisible: "Zxqy, Hana"
- assertVisible: "Placed Nov 11, 2026"
- takeScreenshot: holds-list

# Cancelling asks once more, then moves the Hold out of the queue.
- tapOn:
    id: hold-cancel
- assertVisible: "Leave the queue for this Book?"
- takeScreenshot: holds-cancel-confirm
- tapOn:
    id: hold-cancel-confirm
- extendedWaitUntil:
    visible:
      id: holds-past
    timeout: 15000
- assertVisible: "Cancelled"
- assertNotVisible:
    id: holds-active
- takeScreenshot: holds-cancelled
- runFlow: subflows/leave-search.yaml
- runFlow: subflows/sign-out.yaml
- extendedWaitUntil:
    visible: "SIGN  UP"
    timeout: 20000

# A Visitor sees the Book but is not offered a Hold.
- tapOn:
    id: welcome-sign-in
- tapOn:
    id: sign-in-email
- retry:
    maxRetries: 3
    commands:
      - eraseText: 80
      - inputText: ${output.visitorEmail}
      - assertVisible: ${output.visitorEmail}
- tapOn:
    id: sign-in-password
- inputText: ${output.visitorPassword}
- hideKeyboard
- tapOn:
    id: sign-in-continue

# A Visitor cannot borrow (a loan limit of zero): the tab is "Saved", with Saved books and no segments.
- extendedWaitUntil:
    visible: "Saved"
    timeout: 20000
- assertNotVisible: "My Books"
- runFlow: subflows/leave-search.yaml
- tapOn:
    id: tab-my-books
- extendedWaitUntil:
    visible:
      id: saved-empty
    timeout: 15000
- assertVisible: "Saved books"
- assertNotVisible:
    id: my-books-loans
- assertNotVisible:
    id: my-books-holds
- takeScreenshot: holds-visitor-saved
- runFlow: subflows/leave-search.yaml
- tapOn:
    id: tab-home
- extendedWaitUntil:
    visible:
      id: search-(open|input)
    timeout: 20000
- runFlow:
    file: subflows/search-for.yaml
    env:
      QUERY: ${output.heldWord}
- extendedWaitUntil:
    visible: ${output.heldTitle}
    timeout: 15000
- tapOn: ${output.heldTitle}
- extendedWaitUntil:
    visible:
      id: book-sheet
    timeout: 15000
- assertVisible: "None available"
- assertVisible:
    id: cannot-borrow-note
- assertNotVisible:
    id: hold-action
- assertNotVisible:
    id: hold-place
- takeScreenshot: holds-book-visitor
