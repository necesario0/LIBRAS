# A UMAK Student taps Borrow on a Book with an available Copy: the Digital ID
# opens and nothing is recorded. When the Librarian confirms the Loan at the desk
# (the end-to-end API does it, with the code on the Member's phone), the app shows
# "Successfully Borrowed", My Loans lists the Loan with its dates, and Home counts
# it. The Member renews the Loan from My Loans after a confirmation that shows
# the new due date. A Renewal refused because another Member's Hold arrived
# after the list loaded says so, and a Hold on a Book the Member has on Loan is
# refused with the reason. An overdue Loan is marked on Home and in My Loans with
# its Fine so far, each Loan that cannot be renewed says why, and the Book page
# says in place of Borrow and of Place a Hold that a Member with an overdue Loan
# is not in Good standing.
# Needs the end-to-end API on port 3000 (npm run e2e starts it).
appId: ph.edu.umak.libras
---
- launchApp:
    clearState: true
- runScript: scripts/create-loans.js

# The UMAK Student signs in. The emulator sometimes doubles the first character
# typed after a tap: check and retype.
- extendedWaitUntil:
    visible: "SIGN  UP"
    timeout: 30000
- tapOn:
    id: welcome-sign-in
- tapOn:
    id: sign-in-email
- retry:
    maxRetries: 3
    commands:
      - eraseText: 80
      - inputText: ${output.email}
      - assertVisible: ${output.email}
- tapOn:
    id: sign-in-password
- inputText: ${output.password}
- hideKeyboard
- tapOn:
    id: sign-in-continue

# With no Loans, Home says so.
- extendedWaitUntil:
    visible:
      id: home-loans
    timeout: 20000
- assertVisible: "My Loans"
- assertVisible: "No current Loans"
- takeScreenshot: loans-home-empty

# My Loans is empty too.
- tapOn:
    id: home-loans
- extendedWaitUntil:
    visible:
      id: loans-empty
    timeout: 15000
- assertVisible: "No Loans yet"
- takeScreenshot: loans-list-empty
- tapOn:
    id: loans-back

# A Book with an available Copy has the Borrow action.
- tapOn:
    id: search-input
- inputText: ${output.borrowWord}
- extendedWaitUntil:
    visible: ${output.borrowTitle}
    timeout: 15000
- tapOn: ${output.borrowTitle}
- extendedWaitUntil:
    visible:
      id: book-sheet
    timeout: 15000
- scrollUntilVisible:
    element:
      id: book-borrow
    direction: DOWN
    timeout: 15000
- assertVisible: "Loan period: 7 days. After you tap Borrow, show the code to the librarian."
- assertNotVisible:
    id: hold-action
- takeScreenshot: loans-book-borrow

# Borrow opens the Digital ID.
- tapOn:
    id: book-borrow
- assertVisible: "Show this to the librarian"
- extendedWaitUntil:
    visible:
      id: digital-id-code
    timeout: 15000
- takeScreenshot: loans-digital-id

# Borrow recorded nothing: after waiting longer than the app takes to ask the API
# again, the Digital ID is still showing, and Home still has no Loans.
- extendedWaitUntil:
    visible: "Successfully.*"
    timeout: 6000
    optional: true
- assertVisible:
    id: digital-id-code
- tapOn:
    id: digital-id-done
- tapOn:
    id: book-close
- extendedWaitUntil:
    visible:
      id: search-results
    timeout: 10000
- tapOn:
    id: search-input
- eraseText: 40
- hideKeyboard
- extendedWaitUntil:
    visible:
      id: home-loans-summary
    timeout: 15000
- assertVisible: "No current Loans"

# The Member shows the Digital ID at the desk, and the Librarian confirms the Loan.
- tapOn:
    id: home-digital-id
- extendedWaitUntil:
    visible:
      id: digital-id-code
    timeout: 15000
- runScript: scripts/confirm-loan.js

# The app learns of the Loan from the API and says so.
- extendedWaitUntil:
    visible:
      id: borrowed-card
    timeout: 20000
- assertVisible: "Successfully.*Borrowed"
- assertVisible: "The librarian scanned your code. Enjoy your book !"
- assertVisible: ${output.borrowTitle}
- assertVisible: "Zxqy, Bea"
- assertVisible: "Borrowed on"
- assertVisible: "Return by"
- assertVisible:
    id: borrowed-time-left
    text: "7 days"
- assertVisible:
    id: borrowed-count
    text: "1 of 3"
- assertVisible: "Please return it by [A-Z][a-z]{2} [0-9]{1,2} to avoid a fine\\."
- takeScreenshot: loans-successfully-borrowed

# My Loans lists it with its checkout and due dates.
- tapOn:
    id: borrowed-my-loans
- extendedWaitUntil:
    visible:
      id: loans-current
    timeout: 15000
- assertVisible: "My Loans"
- assertVisible: "Current - 1 of 3"
- assertVisible: ${output.borrowTitle}
- assertVisible: "Borrowed on [A-Z][a-z]{2} [0-9]{1,2}, 20[0-9]{2}"
- assertVisible: "Return by [A-Z][a-z]{2} [0-9]{1,2}, 20[0-9]{2}"
- assertVisible: "On loan"
- assertNotVisible: "Overdue"
- assertVisible:
    id: loan-renew
- takeScreenshot: loans-list

# Renew asks first, with the new due date; "Not now" changes nothing.
- copyTextFrom:
    id: loan-due
- evalScript: ${output.dueBeforeRenewal = maestro.copiedText}
- tapOn:
    id: loan-renew
- extendedWaitUntil:
    visible:
      id: loan-renew-confirmation
    timeout: 5000
- assertVisible: 'Renew this Loan\? The new due date is [A-Z][a-z]{2} [0-9]{1,2}, 20[0-9]{2}\. After this, it cannot be renewed again\.'
- takeScreenshot: loans-renew-confirm
- tapOn:
    id: loan-renew-keep
- assertNotVisible:
    id: loan-renew-confirmation
- assertVisible: ${output.dueBeforeRenewal}
- assertVisible: "On loan"

# The Member renews: the row shows the new due date, that it was renewed, and
# that it cannot be renewed again.
- tapOn:
    id: loan-renew
- copyTextFrom:
    id: loan-renew-question
- evalScript: ${output.renewedDue = maestro.copiedText.match(/[A-Z][a-z][a-z] [0-9]+, [0-9]+/)[0]}
- tapOn:
    id: loan-renew-confirm
- extendedWaitUntil:
    visible: "Renewed"
    timeout: 15000
- assertVisible: "Return by ${output.renewedDue}"
- assertNotVisible: ${output.dueBeforeRenewal}
- assertVisible: "Already renewed. It cannot be renewed again."
- assertNotVisible:
    id: loan-renew
- assertNotVisible:
    id: loan-renew-error
- takeScreenshot: loans-renewed

# Back leads Home, which now counts the Loan.
- tapOn:
    id: loans-back
- extendedWaitUntil:
    visible:
      id: home-loans-summary
    timeout: 15000
- assertVisible: "1 current Loan"
- takeScreenshot: loans-home-one

# A second Loan, of a Book nobody waits for yet, can be renewed.
- runScript: scripts/wanted-loan.js
- tapOn:
    id: home-loans
- extendedWaitUntil:
    visible:
      id: loan-renew
    timeout: 15000
- assertVisible: "Current - 2 of 3"
- assertVisible: ${output.wantedTitle}

# Another Member places a Hold on that Book while the list is open. Renew then
# says what changed, and the row shows the fresh reason.
- runScript: scripts/hold-on-wanted-loan.js
- tapOn:
    id: loan-renew
- tapOn:
    id: loan-renew-confirm
- extendedWaitUntil:
    visible:
      id: loan-renew-error
    timeout: 15000
- assertVisible: "Your Loan was not renewed: another Member is now waiting for this Book. Please return the Copy by its due date."
- extendedWaitUntil:
    visible: "Another Member is waiting for this Book, so it cannot be renewed."
    timeout: 15000
- assertNotVisible:
    id: loan-renew
- takeScreenshot: loans-renew-refused
- tapOn:
    id: loans-back
- extendedWaitUntil:
    visible: "2 current Loans"
    timeout: 15000

# That Book's only Copy is out with this Member: a Hold on it is refused, with
# the reason, because their own return would set the Copy aside for them.
- tapOn:
    id: search-input
- inputText: ${output.wantedWord}
- extendedWaitUntil:
    visible: ${output.wantedTitle}
    timeout: 15000
- tapOn: ${output.wantedTitle}
- extendedWaitUntil:
    visible:
      id: hold-action
    timeout: 15000
- tapOn:
    id: hold-place
- extendedWaitUntil:
    visible:
      id: hold-error
    timeout: 15000
- assertVisible: "You have a Copy of this Book on Loan, so you cannot place a Hold on it. You can see it in My Loans."
- takeScreenshot: loans-hold-refused
- tapOn:
    id: book-close
- extendedWaitUntil:
    visible:
      id: search-results
    timeout: 10000
- tapOn:
    id: search-input
- eraseText: 40
- hideKeyboard
- extendedWaitUntil:
    visible:
      id: home-loans-summary
    timeout: 15000

# A Loan that is past its due date is marked on Home and in My Loans with its
# Fine so far, and cannot be renewed. (It was lent ten days ago, before the
# Member had anything overdue: a Member with an overdue Loan is not in Good
# standing and is lent nothing more.)
- runScript: scripts/overdue-loan.js
- tapOn:
    id: home-loans
- extendedWaitUntil:
    visible:
      id: loans-overdue-notice
    timeout: 15000
- assertVisible: "1 Loan is overdue"
- assertVisible: "Current - 3 of 3"
- assertVisible: ${output.lateTitle}
- assertVisible: "Overdue"
- assertVisible: "Was due [A-Z][a-z]{2} [0-9]{1,2}, 20[0-9]{2}"
# It was due three days ago: three days at PHP 5 a day.
- assertVisible:
    id: loan-fine
    text: "Fine so far: PHP 15 \\(3 days late\\)"
- assertVisible: "Overdue Loans cannot be renewed. Please return it to the library desk."
- takeScreenshot: loans-list-overdue
- tapOn:
    id: loans-back
- extendedWaitUntil:
    visible: "3 current Loans, 1 overdue"
    timeout: 15000
- takeScreenshot: loans-home-overdue

# With an overdue Loan the Member is not in Good standing. The Book page says
# so in place of Borrow (the Book has one Copy fewer on the shelf now) ...
- tapOn:
    id: search-input
- inputText: ${output.borrowWord}
- extendedWaitUntil:
    visible: ${output.borrowTitle}
    timeout: 15000
- tapOn: ${output.borrowTitle}
- extendedWaitUntil:
    visible:
      id: borrow-not-in-good-standing
    timeout: 15000
- assertVisible: "1"
- assertVisible: "You cannot borrow, place a Hold or renew a Loan while you have an overdue Loan. Return it to the library desk and settle its Fine there."
- assertNotVisible:
    id: book-borrow
- takeScreenshot: loans-book-not-in-good-standing

# ... and in place of Place a Hold, on a Book with no Copy on the shelf.
- tapOn:
    id: book-close
- extendedWaitUntil:
    visible:
      id: search-results
    timeout: 10000
- tapOn:
    id: search-input
- eraseText: 40
- inputText: ${output.lateWord}
- extendedWaitUntil:
    visible: ${output.lateTitle}
    timeout: 15000
- tapOn: ${output.lateTitle}
- extendedWaitUntil:
    visible:
      id: hold-not-in-good-standing
    timeout: 15000
- assertVisible: "You have an overdue Loan, so you cannot place a Hold. Return it to the library desk first. You can see it in My Loans."
- assertNotVisible:
    id: hold-place
- takeScreenshot: loans-hold-not-in-good-standing
