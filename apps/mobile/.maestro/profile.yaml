# A Member opens the Profile screen from the Home header and sees the name,
# email and Account Type the API holds for them. The "My account" row opens My
# Account, which shows the same three as read-only fields. Sign out is on Profile
# and Home has none. Profile also shows the Member's Clearance: cleared with no
# Loan out and no Fine; not cleared with a Loan out and on time; with an overdue
# Loan that comes back late, the Fine stands in the way after the Loan is back.
# Not in Good standing (an overdue Loan, then an unsettled Fine), the Member
# reads why on Profile, in My Loans in place of Renew, and on the Book page in
# place of Place a Hold.
# Needs the end-to-end API on port 3000 (npm run e2e starts it).
appId: ph.edu.umak.libras
---
- launchApp:
    clearState: true
- runScript: scripts/create-loans.js

- extendedWaitUntil:
    visible: "SIGN  UP"
    timeout: 30000
- tapOn:
    id: welcome-sign-in
- tapOn:
    id: sign-in-email
- inputText: ${output.email}
- tapOn:
    id: sign-in-password
- inputText: ${output.password}
- hideKeyboard
- tapOn:
    id: sign-in-continue

# Home: the header opens the profile, and Sign out is no longer on Home.
- extendedWaitUntil:
    visible: "Hi, Cobby"
    timeout: 20000
- assertNotVisible:
    id: home-sign-out
- tapOn:
    id: home-profile

# The Profile account screen shows who is signed in, as the API says.
- extendedWaitUntil:
    visible:
      id: profile-name
    timeout: 10000
- assertVisible: "COBBY BALDONADO"
- assertVisible: ${output.email}
- assertVisible: "UMAK Student"

# Clearance: nothing out and nothing owed.
- extendedWaitUntil:
    visible:
      id: profile-clearance-status
    timeout: 10000
- assertVisible:
    id: profile-clearance-status
    text: "Cleared"
- assertVisible: "You have no Loans out and no unsettled Fines."
- takeScreenshot: profile

# A Loan that is out and on time (the Librarian confirms it while My account is
# open): Profile asks again on coming back, and the Member is not cleared.
- tapOn:
    id: profile-my-account
- extendedWaitUntil:
    visible:
      id: my-account-name
    timeout: 10000
- runScript: scripts/confirm-loan.js
- tapOn:
    id: my-account-back
- extendedWaitUntil:
    visible:
      id: profile-clearance-loans
    timeout: 10000
- assertVisible:
    id: profile-clearance-status
    text: "Not cleared"
- assertVisible: "Loan still out"
- assertVisible: ${output.borrowTitle}
- assertNotVisible: "Overdue"
- takeScreenshot: profile-clearance-loan-out

# A second Loan goes overdue (it was lent ten days ago, while the Member was in
# Good standing): Profile says the Member cannot borrow, place a Hold or renew.
- tapOn:
    id: profile-my-account
- extendedWaitUntil:
    visible:
      id: my-account-name
    timeout: 10000
- runScript: scripts/overdue-loan.js
- tapOn:
    id: my-account-back
- extendedWaitUntil:
    visible:
      id: profile-good-standing
    timeout: 10000
- assertVisible:
    id: profile-good-standing
    text: "You cannot borrow, place a Hold or renew a Loan while you have an overdue Loan. Return it to the library desk and settle its Fine there."
- takeScreenshot: profile-not-in-good-standing-overdue

# It comes back three days late: its Fine of PHP 15 is unsettled, and the
# on-time Loan is still out. The Fine is now what stands in the way.
- tapOn:
    id: profile-my-account
- extendedWaitUntil:
    visible:
      id: my-account-name
    timeout: 10000
- runScript: scripts/return-late-loan.js
- tapOn:
    id: my-account-back
- extendedWaitUntil:
    visible:
      id: profile-clearance-fines
    timeout: 10000
- assertVisible: "Unsettled Fine"
- assertVisible: ${output.lateTitle}
- assertVisible: "PHP 15"
- assertVisible: ".*3 days late, returned.*"
- assertVisible: ${output.borrowTitle}
- assertVisible:
    id: profile-good-standing
    text: "You cannot borrow, place a Hold or renew a Loan while you have an unsettled Fine. Settle it at the library desk."
- takeScreenshot: profile-clearance-fine

# My Loans says why the on-time Loan cannot be renewed, in place of Renew.
- tapOn:
    id: profile-back
- extendedWaitUntil:
    visible: "Hi, Cobby"
    timeout: 10000
- tapOn:
    id: home-loans
- extendedWaitUntil:
    visible:
      id: loans-current
    timeout: 15000
- assertVisible: ${output.borrowTitle}
- assertVisible: "You have an unsettled Fine. Renewals can be made again once it is settled at the library desk."
- assertNotVisible:
    id: loan-renew
- takeScreenshot: profile-loans-not-in-good-standing
- tapOn:
    id: loans-back

# The Book page says why in place of Place a Hold, on a Book with no Copy on the shelf.
- extendedWaitUntil:
    visible:
      id: home-loans-summary
    timeout: 15000
- tapOn:
    id: search-input
- inputText: ${output.outWord}
- extendedWaitUntil:
    visible: ${output.outTitle}
    timeout: 15000
- tapOn: ${output.outTitle}
- extendedWaitUntil:
    visible:
      id: hold-not-in-good-standing
    timeout: 15000
- assertVisible: "You cannot borrow, place a Hold or renew a Loan while you have an unsettled Fine. Settle it at the library desk."
- assertNotVisible:
    id: hold-place
- takeScreenshot: profile-book-not-in-good-standing
- tapOn:
    id: book-close
- extendedWaitUntil:
    visible:
      id: search-results
    timeout: 10000
- tapOn:
    id: search-input
- eraseText: 40
- hideKeyboard
- extendedWaitUntil:
    visible:
      id: home-loans-summary
    timeout: 15000
- tapOn:
    id: home-profile
- extendedWaitUntil:
    visible:
      id: profile-name
    timeout: 10000

# The on-time Loan comes back: only the Fine is left in the way.
- tapOn:
    id: profile-my-account
- extendedWaitUntil:
    visible:
      id: my-account-name
    timeout: 10000
- runScript: scripts/return-borrowed-loan.js
- tapOn:
    id: my-account-back
- extendedWaitUntil:
    visible:
      id: profile-clearance-fines
    timeout: 10000
- assertVisible:
    id: profile-clearance-status
    text: "Not cleared"
- assertNotVisible:
    id: profile-clearance-loans
- assertVisible: "PHP 15"
- takeScreenshot: profile-clearance-fine-only

# My account opens the read-only account fields, and Back returns to Profile.
- tapOn:
    id: profile-my-account
- extendedWaitUntil:
    visible:
      id: my-account-name
    timeout: 10000
- assertVisible:
    id: my-account-name
    text: "Cobby Baldonado"
- assertVisible:
    id: my-account-email
    text: ${output.email}
- assertVisible:
    id: my-account-account-type
    text: "UMAK Student"
- takeScreenshot: my-account
- tapOn:
    id: my-account-back
- extendedWaitUntil:
    visible:
      id: profile-name
    timeout: 10000

# Back returns to Home.
- tapOn:
    id: profile-back
- extendedWaitUntil:
    visible: "Hi, Cobby"
    timeout: 10000

# Signing out from the profile leaves every protected screen.
- tapOn:
    id: home-profile
- tapOn:
    id: profile-sign-out
- extendedWaitUntil:
    visible: "SIGN  UP"
    timeout: 20000
- assertNotVisible: "Hi, Cobby"
