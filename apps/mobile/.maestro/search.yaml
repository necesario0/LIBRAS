# A signed-in Member searches the catalog from Home (search mode): an exact
# word, a word with a typo, a Book with no Copy available and a search that
# finds nothing (which is not an error). Search mode itself is in search-mode.yaml.
# Needs the end-to-end API on port 3000 (npm run e2e starts it).
appId: ph.edu.umak.libras
---
- launchApp:
    clearState: true
- runScript:
    file: scripts/create-members.js
- runScript:
    file: scripts/create-books.js

# Sign in.
- extendedWaitUntil:
    visible: "SIGN UP"
    timeout: 30000
- tapOn:
    id: welcome-sign-in
- tapOn:
    id: sign-in-email
- inputText: ${output.email}
- tapOn:
    id: sign-in-password
- inputText: ${output.password}
- hideKeyboard
- tapOn:
    id: sign-in-continue

# Home: the greeting, the search bar and the shelves (home-shelves.yaml checks those), and none of the old recommendation sections.
- extendedWaitUntil:
    visible: "Hi, Cobby"
    timeout: 20000
- assertVisible:
    id: search-open
- extendedWaitUntil:
    visible:
      id: home-shelves
    timeout: 20000
- assertNotVisible: "Book of the month!"
- assertNotVisible: "You might also like these"
- takeScreenshot: home-idle

# An exact word finds the Book and shows how many Copies are available.
- runFlow:
    file: subflows/search-for.yaml
    env:
      QUERY: ${output.word}
- extendedWaitUntil:
    visible: ${output.title}
    timeout: 15000
- assertVisible: "2 of 3 available"
- assertVisible: "Zxqy, Ana M."
- assertNotVisible: "No books found"
- takeScreenshot: search-results

# A typo still finds it.
- runFlow:
    file: subflows/search-for.yaml
    env:
      QUERY: ${output.typo}
- extendedWaitUntil:
    visible: ${output.title}
    timeout: 15000
- assertVisible: "2 of 3 available"

# A Book whose only Copy is on loan says so.
- runFlow:
    file: subflows/search-for.yaml
    env:
      QUERY: ${output.other}
- extendedWaitUntil:
    visible: ${output.loanTitle}
    timeout: 15000
- assertVisible: "None available"
- takeScreenshot: search-none-available

# Nothing matches: a clear "no books found", not an error.
- runFlow:
    file: subflows/search-for.yaml
    env:
      QUERY: ${output.nothing}
- extendedWaitUntil:
    visible: "No books found"
    timeout: 15000
- assertNotVisible: "Search is not working"
- assertNotVisible: ${output.title}
- takeScreenshot: search-no-results

# Cancel leaves search mode: Home with its search bar and the tab bar again.
- tapOn:
    id: search-cancel
- extendedWaitUntil:
    visible:
      id: search-open
    timeout: 10000
- assertVisible:
    id: tab-home

# Sign out is reached from the Profile tab.
- runFlow: subflows/sign-out.yaml
- extendedWaitUntil:
    visible: "SIGN UP"
    timeout: 20000
