# A Member signs in, stays signed in after the app is closed and reopened, and
# signs out; protected screens are then unreachable. Also: wrong credentials
# give one clear message, and an unverified account is sent to verification.
# Needs the end-to-end API on port 3000 (npm run e2e starts it).
appId: ph.edu.umak.libras
---
- launchApp:
    clearState: true
- runScript:
    file: scripts/create-member.js
- evalScript: ${output.member = { email: output.email, password: output.password, firstName: output.firstName }}
- runScript:
    file: scripts/create-member.js
    env:
      VERIFY: "no"
- evalScript: ${output.unverified = { email: output.email, password: output.password }}

# Welcome leads to sign-in.
- extendedWaitUntil:
    visible: "SIGN  UP"
    timeout: 30000
- tapOn:
    id: welcome-sign-in
- assertVisible: "The library for problem solver"
- takeScreenshot: sign-in-empty

# Nothing entered: each field says what is missing, and no request is made.
- tapOn:
    id: sign-in-continue
- assertVisible: "Enter your email address."
- assertVisible: "Enter your password."

# A wrong password: one message that does not say which field was wrong.
- tapOn:
    id: sign-in-email
- inputText: ${output.member.email}
- tapOn:
    id: sign-in-password
- inputText: not-the-password
- hideKeyboard
- tapOn:
    id: sign-in-continue
- assertVisible: "The email or password is incorrect."
- takeScreenshot: sign-in-wrong-credentials

# The right password signs the Member in and opens the landing screen.
- tapOn:
    id: sign-in-password
- eraseText: 40
- inputText: ${output.member.password}
- hideKeyboard
- tapOn:
    id: sign-in-continue
- extendedWaitUntil:
    visible: "Hi, Cobby"
    timeout: 20000
- takeScreenshot: signed-in

# Closing and reopening the app keeps the Member signed in.
- stopApp
- launchApp
- extendedWaitUntil:
    visible: "Hi, Cobby"
    timeout: 30000

# Signing out leaves the protected screen at once.
- tapOn:
    id: home-sign-out
- extendedWaitUntil:
    visible: "SIGN  UP"
    timeout: 20000
- assertNotVisible: "Hi, Cobby"

# A link to the protected screen goes nowhere while signed out ...
- openLink: libras://home
- assertNotVisible: "Hi, Cobby"
- assertVisible: "SIGN  UP"

# ... and the app stays signed out after a restart.
- stopApp
- launchApp
- extendedWaitUntil:
    visible: "SIGN  UP"
    timeout: 30000
- assertNotVisible: "Hi, Cobby"

# An account that never finished verification is guided to the code step.
- tapOn:
    id: welcome-sign-in
- tapOn:
    id: sign-in-email
- inputText: ${output.unverified.email}
- tapOn:
    id: sign-in-password
- inputText: ${output.unverified.password}
- hideKeyboard
- tapOn:
    id: sign-in-continue
- extendedWaitUntil:
    visible: "Check your email to finish signing in"
    timeout: 20000
- assertVisible: ${output.unverified.email}
- assertVisible: "Your email is not verified yet.*"
- takeScreenshot: sign-in-unverified
