# A Member signs in, stays signed in after the app is closed and reopened, and
# signs out; protected screens are then unreachable. Also: wrong credentials
# give one clear message, and an unverified account is sent to verification.
# Needs the end-to-end API on port 3000 (npm run e2e starts it).
appId: ph.edu.umak.libras
---
- launchApp:
    clearState: true
- runScript: scripts/create-members.js

# Welcome leads to sign-in.
- extendedWaitUntil:
    visible: "SIGN  UP"
    timeout: 30000
- tapOn:
    id: welcome-sign-in
- assertVisible: "The library for problem solver"
- takeScreenshot: sign-in-empty

# Nothing entered: each field says what is missing, and no request is made.
- tapOn:
    id: sign-in-continue
- assertVisible: "Enter your email address."
- assertVisible: "Enter your password."

# A wrong password: one message that does not say which field was wrong.
# The emulator sometimes doubles the first character of text typed right after a
# tap (the same happens on the sign-up screens), so the typed text is checked and retyped.
- tapOn:
    id: sign-in-email
- retry:
    maxRetries: 3
    commands:
      - eraseText: 80
      - inputText: ${output.email}
      - assertVisible: ${output.email}
- tapOn:
    id: sign-in-password
- inputText: not-the-password
- hideKeyboard
- tapOn:
    id: sign-in-continue
- assertVisible: "The email or password is incorrect."
- takeScreenshot: sign-in-wrong-credentials

# The right password signs the Member in and opens the landing screen.
- tapOn:
    id: sign-in-password
- tapOn:
    id: sign-in-password-toggle
- retry:
    maxRetries: 3
    commands:
      - tapOn:
          id: sign-in-password
      - eraseText: 80
      - inputText: ${output.password}
      - assertVisible: ${output.password}
- hideKeyboard
- tapOn:
    id: sign-in-continue
- extendedWaitUntil:
    visible: "Welcome, Cobby!"
    timeout: 20000
- assertVisible: ${output.email}
- takeScreenshot: signed-in

# Closing and reopening the app keeps the Member signed in.
- stopApp
- launchApp
- extendedWaitUntil:
    visible: "Welcome, Cobby!"
    timeout: 30000

# Signing out leaves the protected screen at once.
- tapOn:
    id: home-sign-out
- extendedWaitUntil:
    visible: "SIGN  UP"
    timeout: 20000
- assertNotVisible: "Welcome, Cobby!"

# A link to the protected screen goes nowhere while signed out ...
- openLink: libras://home
- assertNotVisible: "Welcome, Cobby!"
- assertVisible: "SIGN  UP"

# ... and the app stays signed out after a restart.
- stopApp
- launchApp
- extendedWaitUntil:
    visible: "SIGN  UP"
    timeout: 30000
- assertNotVisible: "Welcome, Cobby!"

# An account that never finished verification is guided to the code step.
- tapOn:
    id: welcome-sign-in
- tapOn:
    id: sign-in-email
- retry:
    maxRetries: 3
    commands:
      - eraseText: 80
      - inputText: ${output.unverifiedEmail}
      - assertVisible: ${output.unverifiedEmail}
- tapOn:
    id: sign-in-password
- tapOn:
    id: sign-in-password-toggle
- retry:
    maxRetries: 3
    commands:
      - tapOn:
          id: sign-in-password
      - eraseText: 80
      - inputText: ${output.unverifiedPassword}
      - assertVisible: ${output.unverifiedPassword}
- hideKeyboard
- tapOn:
    id: sign-in-continue
- extendedWaitUntil:
    visible: "Check your email to finish signing in"
    timeout: 20000
- assertVisible: ${output.unverifiedEmail}
- assertVisible: "Your email is not verified yet.*"
- takeScreenshot: sign-in-unverified
