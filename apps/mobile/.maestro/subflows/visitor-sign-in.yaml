# Signs in the Visitor made by scripts/create-announcement.js (output.email and output.password) and waits for Home.
appId: ph.edu.umak.libras
---
- extendedWaitUntil:
    visible: "SIGN UP"
    timeout: 30000
- tapOn:
    id: welcome-sign-in
- tapOn:
    id: sign-in-email
- inputText: ${output.email}
- tapOn:
    id: sign-in-password
- inputText: ${output.password}
- hideKeyboard
- tapOn:
    id: sign-in-continue
- extendedWaitUntil:
    visible:
      id: home-shelves
    timeout: 20000
