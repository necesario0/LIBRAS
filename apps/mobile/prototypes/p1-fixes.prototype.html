<title>LIBRAS P1 Fix Prototypes</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700&family=Roboto+Mono:wght@400;500&family=Inter:wght@400;500;600&display=swap">
<!--
  PROTOTYPE, throwaway. Answers: "What should the three P1 critique fixes look like on the LIBRAS mobile app?"
  Plan: for each fix (Borrow handoff, blocked Member, first load), the current app plus three structurally
  different variants, drawn as phone frames in the app's own look, switchable with #<fix>-<variant>,
  the floating bar, or the arrow keys. Nothing here talks to the API; all data is the local demo data.
-->
<style>
/* Layout: a reading column (question, what changes, trade-off) beside a scrolling row of phone frames. */
:root {
  --bg: #F3F5F9;
  --panel: #FFFFFF;
  --fg: #151A2C;
  --muted: #5A6276;
  --line: #DDE2EB;
  --accent: #005DC3;
  --accent-soft: #E3EEFB;
  --pick: #B87900;
  --pick-soft: #FFF3D6;
  --bar-bg: #151A2C;
  --bar-fg: #FFFFFF;
  --font-ui: "Inter", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --font-app: "Montserrat", "Segoe UI", Roboto, sans-serif;
  --font-mono: "Roboto Mono", ui-monospace, Consolas, monospace;

  /* The app's own tokens (apps/mobile/src/theme/tokens.ts). The app is light-only, so the phone keeps them in both page themes. */
  --a-white: #FFFFFF;
  --a-black: #000000;
  --a-brand-ink: #111C4E;
  --a-primary: #005DC3;
  --a-surface: #F0F0F0;
  --a-muted: #747474;
  --a-faint: #AFAFAF;
  --a-accent: #FCBF49;
  --a-highlight: #FFA800;
  --a-danger: #B3261E;
  --a-danger-surface: #FDECEC;
  --a-error: #FF4A4A;
  --a-border: #D9D9D9;
  --a-callno: #9DCCFF;
  --a-avail-surface: #C7FFD5;
  --a-avail-text: #188132;
  --a-info-surface: #CEF2FF;
  --a-body: #6E6E6E;
  --a-scrim: rgba(0,0,0,0.45);
  --a-shadow: rgba(0,0,0,0.18);
  --a-skeleton: #ECEEF1;
  --a-skeleton-hi: #F7F8FA;
  --phone-bezel: #1C1F26;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0E1220; --panel: #161B2B; --fg: #E7EAF2; --muted: #9AA2B6; --line: #283047;
    --accent: #7AB2FF; --accent-soft: #1B2A45; --pick: #F2B84B; --pick-soft: #33290F;
    --bar-bg: #E7EAF2; --bar-fg: #0E1220; --phone-bezel: #000000; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0E1220; --panel: #161B2B; --fg: #E7EAF2; --muted: #9AA2B6; --line: #283047;
  --accent: #7AB2FF; --accent-soft: #1B2A45; --pick: #F2B84B; --pick-soft: #33290F;
  --bar-bg: #E7EAF2; --bar-fg: #0E1220; --phone-bezel: #000000; color-scheme: dark;
}

* { box-sizing: border-box; }
body {
  background: var(--bg); color: var(--fg); font-family: var(--font-ui); font-size: 15px; line-height: 1.5;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 20px 110px;
}
button { font: inherit; cursor: pointer; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

.wrap { max-width: 1320px; margin: 0 auto; display: flex; flex-direction: column; gap: 18px; }
header.top { display: flex; flex-wrap: wrap; gap: 12px 24px; align-items: end; justify-content: space-between; }
.eyebrow { font-size: 12px; letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); font-weight: 600; }
h1 { font-family: var(--font-app); font-size: 26px; line-height: 1.2; margin: 2px 0 0; text-wrap: balance; }
.picks { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; font-size: 13px; color: var(--muted); }
.pick-chip { border: 1px solid var(--line); background: var(--panel); border-radius: 999px; padding: 3px 10px; color: var(--fg); }
.pick-chip b { color: var(--pick); font-weight: 600; }
.btn-ghost { border: 1px solid var(--line); background: var(--panel); color: var(--fg); border-radius: 8px; padding: 5px 12px; font-size: 13px; }

nav.fixes { display: flex; flex-wrap: wrap; gap: 8px; }
nav.fixes button {
  border: 1px solid var(--line); background: var(--panel); color: var(--fg); border-radius: 10px; padding: 8px 14px;
  display: flex; flex-direction: column; align-items: flex-start; gap: 0; text-align: left; min-width: 0;
}
nav.fixes button small { color: var(--muted); font-size: 12px; }
nav.fixes button[aria-current="true"] { border-color: var(--accent); background: var(--accent-soft); }

.stage { display: grid; grid-template-columns: minmax(0, 340px) minmax(0, 1fr); gap: 20px; align-items: start; }
@media (max-width: 860px) { .stage { grid-template-columns: minmax(0, 1fr); } }
.info { background: var(--panel); border: 1px solid var(--line); border-radius: 14px; padding: 18px; display: flex; flex-direction: column; gap: 14px; min-width: 0; }
.info h2 { font-family: var(--font-app); font-size: 19px; margin: 0; line-height: 1.25; text-wrap: balance; }
.info .q { color: var(--muted); font-size: 14px; margin: 0; }
.info h3 { font-size: 12px; letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); margin: 0 0 4px; font-weight: 600; }
.info ul { margin: 0; padding-left: 18px; display: flex; flex-direction: column; gap: 4px; }
.info p { margin: 0; }
.persona { font-size: 13px; border-radius: 8px; background: var(--accent-soft); padding: 6px 10px; }
.files code { font-family: var(--font-mono); font-size: 12px; overflow-wrap: anywhere; }
.pick-btn { align-self: flex-start; border: 1px solid var(--pick); color: var(--pick); background: transparent; border-radius: 8px; padding: 7px 14px; font-weight: 600; }
.pick-btn[aria-pressed="true"] { background: var(--pick-soft); }
.pick-btn[disabled] { opacity: 0.5; cursor: default; }

.frames { display: flex; gap: 22px; overflow-x: auto; padding: 4px 4px 14px; min-width: 0; scroll-snap-type: x proximity; }
figure.frame { margin: 0; display: flex; flex-direction: column; gap: 10px; flex: none; scroll-snap-align: start; }
figcaption { width: 300px; font-size: 13px; color: var(--muted); }
figcaption b { color: var(--fg); font-weight: 600; display: block; }

/* ---------- Phone frame and the app's look ---------- */
.phone { width: 300px; height: 640px; border-radius: 38px; border: 9px solid var(--phone-bezel); background: var(--a-white); position: relative; overflow: hidden; flex: none; box-shadow: 0 10px 30px rgba(10,20,40,0.18); }
.scr { position: absolute; inset: 0; font-family: var(--font-app); color: var(--a-black); background: var(--a-white); font-size: 12px; line-height: 1.35; overflow: hidden; }
.sb { height: 26px; display: flex; justify-content: space-between; align-items: center; padding: 0 18px; font-size: 11px; font-weight: 600; font-family: Roboto, var(--font-ui); }
.sb i { display: inline-block; width: 16px; height: 9px; border: 1.5px solid var(--a-black); border-radius: 2px; margin-left: 4px; position: relative; }
.sb i::after { content: ""; position: absolute; inset: 1px 4px 1px 1px; background: var(--a-black); }
.pad { padding: 0 14px; }

.home-head { display: flex; align-items: center; gap: 9px; padding: 10px 14px 8px; }
.avatar { width: 38px; height: 38px; border-radius: 50%; background: #F6DCC8; position: relative; overflow: hidden; flex: none; }
.avatar::before { content: ""; position: absolute; width: 16px; height: 16px; border-radius: 50%; background: #2B2B33; left: 11px; top: 6px; }
.avatar::after { content: ""; position: absolute; width: 30px; height: 18px; border-radius: 15px 15px 0 0; background: var(--a-brand-ink); left: 4px; top: 25px; }
.hi { font-weight: 700; font-size: 20px; line-height: 1.05; }
.hi-sub { font-size: 8.5px; color: var(--a-faint); font-weight: 600; }
.bell { margin-left: auto; width: 26px; height: 26px; display: grid; place-items: center; position: relative; }
.searchbar { margin: 0 14px; height: 38px; border: 1.5px solid var(--a-black); border-radius: 19px; display: flex; align-items: center; padding: 0 12px; justify-content: space-between; color: var(--a-muted); font-size: 12.5px; box-shadow: 0 3px 5px rgba(0,0,0,0.12); }

.shelf { padding: 14px 14px 0; }
.shelf h4 { font-size: 17px; margin: 0; font-weight: 700; }
.shelf .sub { font-size: 9.5px; color: var(--a-muted); margin-bottom: 8px; }
.covers { display: flex; gap: 10px; overflow: hidden; }
.bk { width: 82px; flex: none; }
.cover { width: 82px; height: 118px; border-radius: 6px; position: relative; overflow: hidden; color: var(--a-white); font-weight: 600; font-size: 10px; display: flex; align-items: flex-end; padding: 8px 8px 12px 13px; }
.cover::before { content: ""; position: absolute; left: 4px; top: 0; bottom: 0; width: 3px; background: rgba(255,255,255,0.35); }
.bk .t { font-size: 10.5px; margin-top: 5px; line-height: 1.25; overflow: hidden; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; }
.bk .a { font-size: 9px; color: var(--a-muted); }

.tabbar { position: absolute; left: 10px; right: 10px; bottom: 16px; height: 56px; border-radius: 28px; background: var(--a-white); box-shadow: 0 6px 18px var(--a-shadow); border: 1px solid rgba(0,0,0,0.06); display: grid; grid-template-columns: repeat(4, 1fr); align-items: center; }
.tab { display: flex; flex-direction: column; align-items: center; gap: 2px; font-size: 10px; font-weight: 500; position: relative; }
.tab.on { color: var(--a-primary); }
.tab.ghost { opacity: 0; }
.tab .dot { position: absolute; top: -2px; left: 54%; width: 6px; height: 6px; border-radius: 50%; background: var(--a-error); }

/* Search behind the Book sheet */
.srch { padding: 8px 12px 0; display: flex; flex-direction: column; gap: 8px; }
.srch-row { display: flex; align-items: center; gap: 8px; }
.srch-in { flex: 1; height: 36px; border: 1.5px solid var(--a-primary); border-radius: 18px; display: flex; align-items: center; padding: 0 12px; gap: 6px; font-size: 12px; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chip { border: 1px solid var(--a-border); border-radius: 999px; padding: 4px 9px; font-size: 10px; font-weight: 500; }
.chip.sel { background: var(--a-accent); border-color: var(--a-black); }

.sheet { position: absolute; left: 0; right: 0; bottom: 0; background: var(--a-white); border-radius: 22px 22px 0 0; box-shadow: 0 -6px 24px rgba(0,0,0,0.12); padding: 8px 14px 18px; display: flex; flex-direction: column; gap: 10px; }
.grab { width: 40px; height: 4px; border-radius: 2px; background: var(--a-border); align-self: center; }
.sheet-top { display: flex; justify-content: flex-end; gap: 8px; }
.save { border: 1px solid var(--a-border); border-radius: 999px; padding: 5px 12px; font-size: 11px; display: flex; align-items: center; gap: 5px; }
.x { width: 30px; height: 30px; border-radius: 50%; background: var(--a-surface); display: grid; place-items: center; }
.bookrow { display: flex; gap: 12px; }
.bigcover { width: 92px; height: 132px; border-radius: 6px; flex: none; position: relative; box-shadow: 0 3px 6px rgba(0,0,0,0.15); }
.bigcover::before { content: ""; position: absolute; left: 5px; top: 0; bottom: 0; width: 3px; background: rgba(255,255,255,0.35); }
.btitle { font-weight: 700; font-size: 15px; line-height: 1.25; }
.bauthor { color: var(--a-muted); font-size: 11px; margin: 3px 0 6px; }
.pills { display: flex; flex-wrap: wrap; gap: 4px; }
.pill { border: 1px solid var(--a-border); border-radius: 999px; padding: 2px 7px; font-size: 9.5px; }
.pill.av { background: var(--a-avail-surface); color: var(--a-avail-text); border-color: transparent; }
.pill.sub { background: var(--a-info-surface); border-color: transparent; font-weight: 600; }
.pill.bad { background: var(--a-danger-surface); color: var(--a-danger); border-color: transparent; font-weight: 600; }
.callno { align-self: flex-start; background: var(--a-callno); border-radius: 999px; padding: 4px 11px; font-family: var(--font-mono); font-size: 10.5px; letter-spacing: 0.02em; }
.kv b { display: block; font-weight: 500; font-size: 12px; }
.kv span { color: var(--a-muted); font-size: 11.5px; }
.body { font-size: 11.5px; color: var(--a-black); }
.body.grey { color: var(--a-body); }
.link { color: var(--a-primary); }
.cta { height: 42px; border-radius: 21px; display: grid; place-items: center; font-size: 15px; font-weight: 500; }
.cta.yellow { background: var(--a-accent); }
.cta.blue { background: var(--a-primary); color: var(--a-white); }
.cta.off { background: var(--a-surface); color: var(--a-muted); }
.cta.outline { border: 1.5px solid var(--a-black); }
.helper { font-size: 10px; color: var(--a-muted); text-align: center; }

.notice { border-radius: 10px; background: var(--a-danger-surface); color: var(--a-danger); padding: 9px 11px; font-size: 11px; display: flex; flex-direction: column; gap: 4px; }
.notice b { font-size: 12.5px; }
.notice.boxed { border: 1.5px solid var(--a-error); background: var(--a-white); }
.notice .act { align-self: flex-start; margin-top: 4px; border: 1.5px solid var(--a-danger); border-radius: 999px; padding: 3px 10px; font-weight: 600; font-size: 10.5px; }

/* Digital ID */
.idh { font-size: 25px; line-height: 1.1; padding: 22px 14px 6px; font-weight: 400; }
.idh em { font-style: normal; color: var(--a-highlight); }
.idsub { font-size: 10.5px; color: var(--a-muted); padding: 0 14px 10px; }
.idbox { margin: 0 14px; border: 2px dashed var(--a-border); border-radius: 14px; padding: 14px 10px 10px; display: flex; flex-direction: column; align-items: center; gap: 6px; }
.idbox svg { display: block; }
.idnum { font-family: var(--font-mono); font-size: 13px; letter-spacing: 0.18em; }
.cd { font-size: 10px; color: var(--a-muted); display: flex; align-items: center; gap: 4px; }
.idbox .cd svg { display: inline; }
.cd b { color: var(--a-black); }
.idname { text-align: center; padding-top: 10px; }
.idname b { display: block; font-size: 13px; }
.idname span { font-size: 11px; }
.bright { margin: 10px 14px 0; background: var(--a-surface); border-radius: 10px; padding: 8px 10px; font-size: 9.5px; color: var(--a-muted); }
.forcard { margin: 0 14px 10px; border-radius: 12px; border: 1.5px solid var(--a-primary); padding: 9px 11px; display: flex; gap: 10px; align-items: center; }
.forcard .mini { width: 34px; height: 48px; border-radius: 4px; flex: none; position: relative; }
.forcard .mini::before { content: ""; position: absolute; left: 3px; top: 0; bottom: 0; width: 2px; background: rgba(255,255,255,0.35); }
.forcard .lbl { font-size: 9px; letter-spacing: 0.08em; text-transform: uppercase; color: var(--a-primary); font-weight: 700; }
.forcard .tt { font-weight: 600; font-size: 12px; line-height: 1.2; }
.forcard .callno { margin-top: 4px; font-size: 9.5px; padding: 2px 8px; }
.stub { margin: 0 14px; border: 2px dashed var(--a-border); border-top: none; border-radius: 0 0 14px 14px; padding: 12px 12px 12px; position: relative; display: flex; flex-direction: column; gap: 4px; }
.stub::before { content: ""; position: absolute; left: -2px; right: -2px; top: 0; border-top: 2px dotted var(--a-black); opacity: 0.35; }
.stub .lbl { font-size: 9px; letter-spacing: 0.08em; text-transform: uppercase; color: var(--a-muted); font-weight: 700; }
.stub .shelf-no { font-family: var(--font-mono); font-size: 17px; letter-spacing: 0.02em; }
.idbox.top { border-radius: 14px 14px 0 0; border-bottom: none; }
.intent { display: inline-flex; gap: 6px; align-items: center; margin: 18px 14px 0; background: var(--a-info-surface); border-radius: 999px; padding: 3px 10px; font-size: 10px; font-weight: 700; color: var(--a-brand-ink); }
.dim { filter: grayscale(1); opacity: 0.25; }

.standing-bar { position: absolute; left: 10px; right: 10px; bottom: 80px; border-radius: 14px; background: var(--a-danger); color: var(--a-white); padding: 8px 12px; font-size: 10.5px; display: flex; align-items: center; justify-content: space-between; gap: 8px; box-shadow: 0 6px 14px rgba(179,38,30,0.25); }
.standing-bar b { display: block; font-size: 11.5px; }

.task { margin: 12px 14px 0; border-radius: 14px; background: var(--a-white); border: 1.5px solid var(--a-error); padding: 11px 12px; display: flex; flex-direction: column; gap: 8px; }
.task h5 { margin: 0; font-size: 14px; }
.task .step { display: flex; gap: 8px; align-items: flex-start; font-size: 11px; }
.task .box { width: 14px; height: 14px; border: 1.5px solid var(--a-black); border-radius: 4px; flex: none; margin-top: 1px; }

.steps { display: flex; flex-direction: column; gap: 10px; }
.stepn { display: flex; gap: 10px; align-items: flex-start; }
.num { width: 22px; height: 22px; border-radius: 50%; background: var(--a-accent); display: grid; place-items: center; font-weight: 700; font-size: 11px; flex: none; }

.skel { background: linear-gradient(90deg, var(--a-skeleton) 0%, var(--a-skeleton-hi) 50%, var(--a-skeleton) 100%); background-size: 200% 100%; animation: shimmer 1.4s linear infinite; border-radius: 6px; }
@keyframes shimmer { from { background-position: 200% 0; } to { background-position: 0 0; } }
.spin { width: 12px; height: 12px; border: 2px solid var(--a-border); border-top-color: var(--a-primary); border-radius: 50%; animation: spin 0.8s linear infinite; display: inline-block; }
@keyframes spin { to { transform: rotate(360deg); } }
@media (prefers-reduced-motion: reduce) { .skel, .spin { animation: none; } }
.refresh { position: absolute; left: 50%; transform: translateX(-50%); top: 112px; background: var(--a-brand-ink); color: var(--a-white); border-radius: 999px; padding: 4px 10px; font-size: 9.5px; display: flex; gap: 6px; align-items: center; box-shadow: 0 3px 8px rgba(0,0,0,0.2); }
.refresh .spin { border-color: rgba(255,255,255,0.3); border-top-color: var(--a-white); }
.splash { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px; }
.logo { width: 92px; height: 92px; border-radius: 50%; background: var(--a-primary); position: relative; }
.logo::before { content: ""; position: absolute; left: 30px; top: 22px; width: 14px; height: 46px; border-radius: 4px; background: var(--a-white); }
.logo::after { content: ""; position: absolute; left: 30px; top: 58px; width: 36px; height: 10px; border-radius: 5px; background: var(--a-brand-ink); box-shadow: 0 -3px 0 var(--a-white); }
.logo i { position: absolute; left: 47px; top: 22px; width: 12px; height: 20px; background: var(--a-accent); clip-path: polygon(0 0, 100% 0, 100% 100%, 50% 75%, 0 100%); }
.progress { width: 150px; height: 4px; border-radius: 2px; background: var(--a-surface); overflow: hidden; }
.progress div { height: 100%; width: 62%; background: var(--a-primary); border-radius: 2px; }
.loadlist { font-size: 10.5px; color: var(--a-muted); display: flex; flex-direction: column; gap: 3px; align-items: flex-start; }

/* Floating switcher: deliberately not the app's look */
.switcher { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(16px + env(safe-area-inset-bottom, 0px)); background: var(--bar-bg); color: var(--bar-fg); border-radius: 999px; display: flex; align-items: center; gap: 4px; padding: 6px; box-shadow: 0 8px 28px rgba(0,0,0,0.3); z-index: 20; max-width: calc(100vw - 32px); }
.switcher button { width: 38px; height: 38px; border-radius: 50%; border: none; background: transparent; color: inherit; font-size: 18px; display: grid; place-items: center; }
.switcher button:hover { background: rgba(127,127,127,0.25); }
.switcher .lbl { padding: 0 12px; font-size: 13px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0; }
.switcher .lbl span { opacity: 0.65; font-weight: 400; }
.kbd { font-size: 12px; color: var(--muted); }
</style>

<div class="wrap">
  <header class="top">
    <div>
      <div class="eyebrow">Prototype · LIBRAS mobile · critique P1 fixes</div>
      <h1>What should the three P1 fixes look like?</h1>
    </div>
    <div class="picks" id="picks" aria-live="polite"></div>
  </header>
  <nav class="fixes" id="fixes" aria-label="Fix"></nav>
  <main class="stage">
    <section class="info" id="info"></section>
    <section class="frames" id="frames" aria-label="Phone screens"></section>
  </main>
  <p class="kbd">Use ← and → to switch variants, 1 2 3 to switch fix. Every screen uses the local demo accounts; nothing here talks to the API.</p>
</div>

<div class="switcher" role="toolbar" aria-label="Variant switcher">
  <button id="prev" aria-label="Previous variant">←</button>
  <div class="lbl" id="vlabel"></div>
  <button id="next" aria-label="Next variant">→</button>
</div>

<script>
/* ---------- Small drawing helpers ---------- */
const ICON = {
  home: '<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"><path d="M4 10.5 12 4l8 6.5V20h-5v-6H9v6H4z"/></svg>',

/* A Code 128-looking bar pattern, deterministic per seed. */
function bars(seed, w = 220, h = 64) {
  let x = 0, s = seed, out = "";
  const rnd = () => (s = (s * 9301 + 49297) % 233280) / 233280;
  while (x < w - 4) {
    const bw = 1 + Math.floor(rnd() * 3) * 1.3, gap = 1 + Math.floor(rnd() * 3) * 1.2;
    out += `<rect x="${x.toFixed(1)}" y="0" width="${bw.toFixed(1)}" height="${h}" fill="#000"/>`;
    x += bw + gap;
  }
  return `<svg width="${w}" height="${h}" viewBox="0 0 ${w} ${h}" aria-label="Digital ID barcode">${out}</svg>`;
}

function readHash() {
  const m = /^#([a-z]+)-([a-z]+)$/.exec(location.hash);
  if (!m) return;
  const f = FIXES.findIndex(x => x.id === m[1]);
  if (f < 0) return;
  const v = FIXES[f].variants.findIndex(x => x.key === m[2]);
  if (v < 0) return;
  fixIdx = f; varIdx = v;
}
function go(f, v) {
  fixIdx = (f + FIXES.length) % FIXES.length;
  const n = FIXES[fixIdx].variants.length;
  varIdx = (v + n) % n;
  const h = `#${FIXES[fixIdx].id}-${FIXES[fixIdx].variants[varIdx].key}`;
  if (location.hash !== h) history.replaceState(null, "", h);
  render();
}

function render() {
  const fix = FIXES[fixIdx], v = fix.variants[varIdx];
  document.getElementById("fixes").innerHTML = FIXES.map((f, i) =>
    `<button data-fix="${i}" aria-current="${i === fixIdx}">${i + 1}. ${f.name}<small>${f.short}${picks[f.id] ? ` · picked ${picks[f.id].toUpperCase()}` : ""}</small></button>`).join("");
  const picked = picks[fix.id] === v.key;
  document.getElementById("info").innerHTML = `
    <div class="eyebrow">${fix.name} · ${v.key === "now" ? "current app" : "variant " + v.key.toUpperCase()}</div>
    <h2>${v.name}</h2>
    <p class="q">${fix.question}</p>
    <div class="persona">${fix.persona}</div>
    <p>${v.summary}</p>
    <div><h3>${v.key === "now" ? "What happens" : "What changes"}</h3><ul>${v.changes.map(c => `<li>${c}</li>`).join("")}</ul></div>
    <div><h3>Trade-off</h3><p>${v.tradeoff}</p></div>
    ${v.files.length ? `<div class="files"><h3>Files it touches</h3><ul>${v.files.map(f => `<li><code>${f}</code></li>`).join("")}</ul></div>` : ""}
    <button class="pick-btn" id="pick" aria-pressed="${picked}" ${v.key === "now" ? "disabled" : ""}>${v.key === "now" ? "Baseline" : picked ? "✓ Picked for " + fix.name : "Pick this variant"}</button>`;
  document.getElementById("frames").innerHTML = v.frames.map(([cap, sub, draw], i) =>
    `<figure class="frame"><div class="phone">${draw()}</div><figcaption><b>${i + 1}. ${cap}</b>${sub}</figcaption></figure>`).join("");
  document.getElementById("vlabel").innerHTML = `${fix.name}: ${v.key === "now" ? "Now" : v.key.toUpperCase()} <span>(${v.name})</span>`;
  const summary = FIXES.map(f => `<span class="pick-chip">${f.name}: <b>${picks[f.id] ? picks[f.id].toUpperCase() : "–"}</b></span>`).join("");
  document.getElementById("picks").innerHTML = `Your picks ${summary}<button class="btn-ghost" id="copy">Copy picks</button>`;
  document.getElementById("frames").scrollLeft = 0;
}

document.addEventListener("click", e => {
  const fb = e.target.closest("[data-fix]");
  if (fb) return go(+fb.dataset.fix, 1);
  if (e.target.closest("#prev")) return go(fixIdx, varIdx - 1);
  if (e.target.closest("#next")) return go(fixIdx, varIdx + 1);
  if (e.target.closest("#pick")) {
    const f = FIXES[fixIdx], v = f.variants[varIdx];
    if (v.key === "now") return;
    picks[f.id] = picks[f.id] === v.key ? undefined : v.key;
    if (!picks[f.id]) delete picks[f.id];
    savePicks(); render(); return;
  }
  const cp = e.target.closest("#copy");
  if (cp) {
    const text = "Prototype picks: " + FIXES.map(f => `${f.name} ${picks[f.id] ? picks[f.id].toUpperCase() + " (" + f.variants.find(v => v.key === picks[f.id]).name + ")" : "none"}`).join(", ");
    navigator.clipboard.writeText(text).then(() => { cp.textContent = "Copied"; }, () => { cp.textContent = text; });
  }
});
document.addEventListener("keydown", e => {
  if (e.target.closest && e.target.closest("input, textarea, [contenteditable]")) return;
  if (e.key === "ArrowLeft") go(fixIdx, varIdx - 1);
  else if (e.key === "ArrowRight") go(fixIdx, varIdx + 1);
  else if (["1", "2", "3"].includes(e.key)) go(+e.key - 1, 1);
});
window.addEventListener("hashchange", () => { readHash(); render(); });

/* The Digital ID countdown ticks like the app's. */
let sec = 51;
setInterval(() => { sec = sec <= 1 ? 60 : sec - 1; const t = `0:${String(sec).padStart(2, "0")}`; document.querySelectorAll(".tick").forEach(n => { n.textContent = sec === 60 ? "1:00" : t; }); }, 1000);

readHash();
render();
</script>
